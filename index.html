<style>
/* Layout: sticky header, split hero (copy + live "open now" card with a dental-arch chart), stacked sections on a cool clinical ground, fixed action bar on phones. */
:root{
  --bg:#F4F8F9; --surface:#FFFFFF; --ink:#0E2230; --muted:#516B78; --line:#D9E5E9;
  --accent:#0A7C8C; --accent-ink:#FFFFFF; --soft:#E2F1F2; --warm:#E9A92C; --guess:#C98A12;
  --display:"Manrope","Noto Sans Georgian",system-ui,sans-serif;
  --body:"Inter","Noto Sans Georgian",system-ui,sans-serif;
  --radius:14px; --wrap:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A151C; --surface:#11212A; --ink:#E4EEF1; --muted:#8EA7B2; --line:#1F3440;
  --accent:#3BB7C4; --accent-ink:#04232A; --soft:#12313A; --warm:#F2B544; --guess:#F2B544; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A151C; --surface:#11212A; --ink:#E4EEF1; --muted:#8EA7B2; --line:#1F3440;
  --accent:#3BB7C4; --accent-ink:#04232A; --soft:#12313A; --warm:#F2B544; --guess:#F2B544; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
:lang(ka) h1,:lang(ka) h2,:lang(ka) h3{letter-spacing:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* demo ribbon */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:7px}
.demo p{flex:1 1 220px;min-width:0}
.demo button{font:600 12px/1 var(--body);background:transparent;color:inherit;border:1px solid currentColor;border-radius:99px;padding:6px 10px;cursor:pointer;opacity:.9}
.demo .legend{flex-basis:100%;opacity:.8}
body:not(.notes) .demo .legend{display:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;flex-direction:column;text-decoration:none;line-height:1}
.logo b{font:800 20px/1 var(--display);letter-spacing:.16em}
.logo span{font:600 10px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-top:5px}
nav.main{display:none;gap:22px;margin-left:auto}
nav.main a{text-decoration:none;font-weight:500;font-size:15px;color:var(--muted)}
nav.main a:hover{color:var(--ink)}
.langs{display:flex;gap:2px;margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px}
.langs button{font:600 12px/1 var(--body);border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:99px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

@media (min-width:900px){nav.main{display:flex}.langs{margin-left:0}header.top .hdr-book{display:inline-flex}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);text-decoration:none;border-radius:99px;padding:14px 20px;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn .ico{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}

.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}

.btn-wa{background:#1FA855;color:#fff}
.btn-sm{padding:10px 16px;font-size:14px}

/* hero */
.hero{padding-block:44px 56px;background:radial-gradient(1100px 420px at 85% 0%,var(--soft),transparent 70%)}
.hero .wrap{display:grid;gap:36px;align-items:center}

.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;margin-top:14px}

.hero .lead{font-size:18px;color:var(--muted);margin-top:18px;max-width:34em}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.rating{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:14px;color:var(--muted);text-decoration:none}
.rating strong{font:800 22px/1 var(--display);color:var(--ink)}
.stars{color:var(--warm);letter-spacing:2px;font-size:15px}

.card-now{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 50px -30px rgba(10,60,70,.35)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-weight:600}

.hgroups div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;height:72px;border-radius:6px;background:var(--bg);position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;background:var(--soft);border-top:2px solid var(--accent)}
.week .is-today{color:var(--ink);font-weight:700}
.week .is-today i b{background:var(--accent)}
.card-now .addr{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15px}
.card-now .addr .ico{color:var(--accent);margin-top:1px}
.card-now .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.card-now .row .btn{flex:1 1 120px}

/* highlights */
.highs{border-block:1px solid var(--line);background:var(--surface)}
.highs .wrap{display:grid;gap:0;grid-template-columns:1fr}

.high{display:flex;gap:14px;align-items:flex-start;padding-block:20px}
@media (min-width:760px){.high+.high{border-left:1px solid var(--line);padding-left:24px}}

.high .ico{color:var(--accent);width:26px;height:26px}
.high b{display:block;font:700 15px/1.3 var(--display)}
.high span{font-size:14px;color:var(--muted)}

/* sections */
section.sec{padding-block:64px}
@media (min-width:900px){section.sec{padding-block:88px}}
.sec-head{display:grid;gap:10px;margin-bottom:32px;max-width:640px}
.sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.sec-head p{color:var(--muted);font-size:17px}
.alt{background:var(--surface);border-block:1px solid var(--line)}

.svc{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.svc article{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;gap:10px;align-content:start}
.svc .ico{width:34px;height:34px;color:var(--accent);stroke-width:1.5}
.svc h3{font-size:18px;font-weight:700}
.svc p{color:var(--muted);font-size:15px}

.prices{display:grid;gap:28px}
@media (min-width:900px){.prices{grid-template-columns:.8fr 1.2fr;align-items:start}}
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable td{padding:14px 0;border-bottom:1px dashed var(--line);vertical-align:baseline}
.ptable td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:16px}
.ptable .tbd{color:var(--muted);font-weight:500}

.team{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
@media (min-width:860px){.team{grid-template-columns:repeat(3,1fr);gap:20px}}
.doc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;min-width:0}
.ava{aspect-ratio:4/5;max-width:100%;width:100%;display:grid;place-items:center;font:800 clamp(28px,5vw,44px)/1 var(--display);color:var(--accent);background:repeating-linear-gradient(135deg,transparent 0 11px,color-mix(in srgb,var(--accent) 8%,transparent) 11px 12px),var(--soft);object-fit:cover}
.doc div{padding:14px 16px 16px;min-width:0}
.doc b{display:block;font:700 17px/1.3 var(--display)}
.doc div span{display:block;font-size:14px;color:var(--muted);margin-top:2px}

.revs{columns:1;column-gap:14px}
@media (min-width:700px){.revs{columns:2}}
@media (min-width:1000px){.revs{columns:3}}
.rev{break-inside:avoid;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.rev .stars{font-size:14px}
.rev blockquote{margin:10px 0 14px;font-size:15.5px}
.rev footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.rev footer b{color:var(--ink);font-weight:600}
.revs-more{margin-top:12px}

.intl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.intl article{display:flex;gap:14px;padding:18px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line)}
.intl .ico{color:var(--accent);margin-top:2px}
.intl h3{font-size:16px;font-weight:700;margin-bottom:4px}
.intl p{font-size:14.5px;color:var(--muted)}

.gal{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.gal{grid-template-columns:repeat(3,1fr)}}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:var(--muted);font-size:13px;background:
  repeating-linear-gradient(135deg,transparent 0 11px,color-mix(in srgb,var(--accent) 8%,transparent) 11px 12px),var(--soft)}
.ph b{color:var(--ink);font:700 15px/1.2 var(--display)}

.contact{display:grid;gap:20px}
@media (min-width:900px){.contact{grid-template-columns:1fr 1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
.box h3{font-size:20px;font-weight:700;margin-bottom:14px}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right}
.hours tr.is-today td{font-weight:700;color:var(--accent)}
.map{margin-top:18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;position:relative;background:var(--soft)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map-static{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;background:
  linear-gradient(0deg,transparent 47%,var(--surface) 47% 53%,transparent 53%),
  linear-gradient(90deg,transparent 30%,var(--surface) 30% 35%,transparent 35%),
  linear-gradient(28deg,transparent 60%,var(--surface) 60% 64%,transparent 64%),
  repeating-linear-gradient(0deg,transparent 0 38px,color-mix(in srgb,var(--line) 70%,transparent) 38px 40px),
  repeating-linear-gradient(90deg,transparent 0 38px,color-mix(in srgb,var(--line) 70%,transparent) 38px 40px),var(--soft)}
.map-static span{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:99px;font-weight:600;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.phone-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:15px;color:var(--muted)}
.phone-line b{font:700 20px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}
.copy{font:600 12px/1 var(--body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 10px;cursor:pointer}

form.book{display:grid;gap:12px}
.f2{display:grid;gap:12px}
@media (min-width:560px){.f2{grid-template-columns:1fr 1fr}}
label.fl{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fl input,.fl select,.fl textarea{font:400 16px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.fl textarea{min-height:84px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ferr{color:#C2410C;font-size:13px;min-height:1em}
.book .btn{justify-self:start}

footer.site{padding-block:36px 120px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

@media (min-width:900px){footer.site{padding-bottom:40px}}

/* phone action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bar .btn{padding:12px 8px;font-size:14px}

/* guessed content markers */
body.notes .guess{outline:2px dashed var(--guess);outline-offset:4px;border-radius:8px;position:relative}
body.notes .guess::after{content:attr(data-tag);position:absolute;top:-11px;right:8px;font:700 10px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;background:var(--guess);color:#1b1300;padding:4px 6px;border-radius:5px;z-index:2;pointer-events:none}
</style>

    if (i===0 && n.min >= toMin(x[0])) continue;
    const dn = i===0 ? T('today') : i===1 ? T('tomorrow') : I[lang].days[d];
    return { open:false, text: T('opens',{d:dn,t:x[0]}) };
  }
  return { open:false, text:'' };
}

function render(){
  const D = I[lang];
  document.documentElement.lang = D.htmlLang;
  document.body.classList.toggle('notes', notes);
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));

  $('demoText').textContent = T('demoText',{name:L(C.name)});
  $('notesBtn').textContent = notes ? T('notesHide') : T('notesShow');
  $('notesLegend').textContent = T('notesLegend');

  $('logo').innerHTML = `<b>${esc(C.brand.word)}</b><span>${esc(C.brand.sub)}</span>`;
  $('logo').setAttribute('aria-label', L(C.name));
  $('nav').innerHTML = ['services','prices','team','reviews','contact'].map(k=>`<a href="#${k}">${esc(D.nav[k])}</a>`).join('');
  $('langs').innerHTML = LANGS.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===lang}" lang="${l}">${esc(I[l].langName)}</button>`).join('');

  $('heroTitle').textContent = L(C.hero.title);
  $('heroLead').textContent = L(C.hero.lead);
  const waLink = `<a class="btn btn-wa${G(C.whatsapp)}" href="${waBase}?text=${encodeURIComponent(T('waHello'))}" target="_blank" rel="noopener">${ico('wa')}${esc(T('whatsapp'))}</a>`;
  $('heroCtas').innerHTML = `<a class="btn btn-primary" href="#book">${ico('book')}${esc(T('book'))}</a>${waLink}<a class="btn btn-ghost" href="${telHref}">${ico('phone')}${esc(C.phoneDisplay)}</a>`;
  $('rating').href = C.mapsUrl;
  $('rating').innerHTML = `<strong>${C.rating.toFixed(1)}</strong><span class="stars" aria-hidden="true">★★★★★</span><span>${esc(T('reviewsOnGoogle',{n:C.reviewCount}))}</span>`;

  const st = openState(), nd = tbilisiNow();
  // group consecutive days with the same hours: "Mon–Fri 10:00–20:00"
  const groups = [];
  C.hours.forEach((x,i)=>{ const k = x ? x.join('–') : ''; const g = groups[groups.length-1];
    if (g && g.k === k) { g.to = i; } else groups.push({k, from:i, to:i}); });
  $('nowCard').innerHTML = `<p class="eyebrow" style="margin-bottom:14px">${esc(T('hoursTitle'))}</p>
    <div class="status"><span class="dot${st.open?' open':''}"></span>${esc(st.open?T('openNow'):T('closedNow'))} <small>${esc(st.text)}</small></div>
    <dl class="hgroups">${groups.map(g=>{
      const today = nd.day>=g.from && nd.day<=g.to;
      const days = g.from===g.to ? D.days[g.from] : `${D.daysShort[g.from]} – ${D.daysShort[g.to]}`;
      return `<div class="${today?'is-today':''}"><dt>${esc(days)}</dt><dd>${g.k?esc(g.k.replace('–',' – ')):esc(D.closed)}</dd></div>`;}).join('')}</dl>
    <p class="addr">${ico('pin')}<span>${esc(L(C.address))}</span></p>
    <div class="row"><a class="btn btn-ghost btn-sm" href="${telHref}">${ico('phone')}${esc(T('call'))}</a><a class="btn btn-ghost btn-sm" href="${C.directionsUrl}" target="_blank" rel="noopener">${ico('pin')}${esc(T('directions'))}</a></div>`;

  $('highs').innerHTML = C.highlights.map(x=>`<div class="high${G(x)}">${ico(x.icon)}<div><b>${esc(L(x.title))}</b><span>${esc(L(x.text))}</span></div></div>`).join('');

  $('svc').innerHTML = C.services.map(s=>`<article class="${G(s).trim()}">${ico(s.icon)}<h3>${esc(L(s.title))}</h3><p>${esc(L(s.text))}</p></article>`).join('');

  $('ptableWrap').innerHTML = `<div class="${G(C.pricesNote).trim()}"><table class="ptable"><tbody>${C.prices.map(p=>`<tr><td>${esc(L(p.name))}</td><td>${p.price==null?`<span class="tbd">— ₾</span>`:esc(T('priceFrom',{p:p.price}))}</td></tr>`).join('')}</tbody></table>${C.prices.some(p=>p.price==null)?`<p style="margin-top:12px;font-size:14px;color:var(--muted)">${esc(T('pricesNoteText'))}</p>`:''}</div>`;

  $('teamGrid').className = 'team';
  if (C.teamNote && C.teamNote.guess){ $('teamGrid').classList.add('guess'); $('teamGrid').dataset.tag = T('guessTag'); $('teamGrid').title = C.teamNote.note||''; }
  $('teamGrid').innerHTML = C.team.map(d=>{
    const nm = L(d.name), ini = (d.name.en||nm).split(' ').map(w=>w[0]).slice(0,2).join('');
    const yrs = d.years ? (lang==='ru' ? 'Опыт: '+ruYears(d.years) : T('years',{n:d.years})) : '';
    const pic = d.photo ? `<img class="ava" src="${esc(d.photo)}" alt="${esc(nm)}">` : `<span class="ava" aria-hidden="true">${esc(ini)}</span>`;
    return `<div class="doc">${pic}<div><b>${esc(nm)}</b><span>${esc(L(d.role))}</span>${yrs?`<span>${esc(yrs)}</span>`:''}</div></div>`;}).join('');

  $('revSummary').innerHTML = `<span class="stars">★★★★★</span> <b>${C.rating.toFixed(1)}</b> · ${esc(T('reviewsOnGoogle',{n:C.reviewCount}))}`;
  $('revs').innerHTML = C.reviews.map(r=>`<figure class="rev" lang="${esc(r.lang)}"><span class="stars" aria-label="${r.stars}/5">${'★'.repeat(r.stars)}</span><blockquote>${esc(r.text)}</blockquote><footer><b>${esc(r.author)}</b><span>${esc(T('reviewFrom'))}</span></footer></figure>`).join('');
  $('revMore').href = C.mapsUrl; $('revMore').textContent = T('allReviews') + ' →';

  $('intl').innerHTML = C.intl.map(x=>`<article class="${G(x).trim()}">${ico(x.icon)}<div><h3>${esc(L(x.title))}</h3><p>${esc(L(x.text))}</p></div></article>`).join('');

  $('gal').className = 'gal';
  if (C.galleryNote && C.galleryNote.guess){ $('gal').classList.add('guess'); $('gal').dataset.tag = T('guessTag'); $('gal').title = C.galleryNote.note||''; }
  $('gal').innerHTML = C.gallery.map(g=> g.src ? `<img class="ph" src="${esc(g.src)}" alt="${esc(L(g.label))}" style="object-fit:cover;padding:0">` : `<div class="ph"><b>${esc(L(g.label))}</b><span>${esc(T('photoSoon'))}</span></div>`).join('');

  $('addrLine').innerHTML = `${esc(L(C.address))}`;
  $('phoneText').textContent = C.phoneDisplay; $('phoneText2').textContent = C.phoneDisplay;
  $('copyPhone').textContent = T('copy');
  $('map').innerHTML = BUILD.embedMap
    ? `<iframe title="${esc(T('mapAlt',{a:L(C.address)}))}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${C.geo.lat},${C.geo.lng}&z=17&hl=${lang}&output=embed"></iframe>`
    : `<a class="map-static" href="${C.mapsUrl}" target="_blank" rel="noopener" aria-label="${esc(T('openMaps'))}"><span>${ico('pin')}${esc(L(C.name))}</span></a>`;
  $('mapLinks').innerHTML = `<a class="btn btn-ghost btn-sm" href="${C.mapsUrl}" target="_blank" rel="noopener">${ico('pin')}${esc(T('openMaps'))}</a><a class="btn btn-ghost btn-sm" href="${C.directionsUrl}" target="_blank" rel="noopener">${esc(T('directions'))} →</a>`;
  $('hoursTable').innerHTML = C.hours.map((x,i)=>`<tr class="${i===nd.day?'is-today':''}"><td>${esc(D.days[i])}</td><td>${x?x.join(' – '):esc(D.closed)}</td></tr>`).join('');

  const sel = $('f-service'), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(T('fServiceAny'))}</option>` + C.services.map((s,i)=>`<option value="${i}">${esc(L(s.title))}</option>`).join('');
  sel.value = cur;
  $('f-note').placeholder = T('fNotePh');
  const sub = $('f-submit'); sub.innerHTML = ico('wa') + esc(T('fSubmit'));
  if (C.whatsapp.guess){ sub.classList.add('guess'); sub.dataset.tag = T('guessTag'); sub.title = C.whatsapp.note||''; }

  $('foot').textContent = `© ${new Date().getFullYear()} ${L(C.name)} · ${L(C.address)}`;
  $('footLinks').innerHTML = (C.instagram ? `<a class="btn btn-ghost btn-sm" href="${C.instagram}" target="_blank" rel="noopener">${ico('insta')}Instagram</a>` : '')
    + (C.facebook && C.facebook.url ? `<a class="btn btn-ghost btn-sm${G(C.facebook)}" href="${C.facebook.url}" target="_blank" rel="noopener">${ico('fb')}Facebook</a>` : '');

  $('bar').innerHTML = `<a class="btn btn-ghost" href="${telHref}">${ico('phone')}${esc(T('call'))}</a><a class="btn btn-wa" href="${waBase}?text=${encodeURIComponent(T('waHello'))}" target="_blank" rel="noopener">${ico('wa')}WhatsApp</a><a class="btn btn-primary" href="#book">${esc(T('book'))}</a>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-l]');
  if (b){ lang = b.dataset.l; try{localStorage.setItem('lang',lang)}catch(_){} render(); return; }
  if (e.target.closest('#notesBtn')){ notes = !notes; try{localStorage.setItem('notes',notes?'1':'0')}catch(_){} render(); return; }
  if (e.target.closest('#copyPhone')){
    const btn = $('copyPhone');
    const done = () => { btn.textContent = T('copied'); setTimeout(()=>btn.textContent=T('copy'),1500); };
    try { navigator.clipboard.writeText(C.phone).then(done, ()=>selectPhone()); } catch(_) { selectPhone(); }
  }
});
function selectPhone(){ const r=document.createRange(); r.selectNodeContents($('phoneText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
window.addEventListener('hashchange', () => { const x = location.hash.slice(1); if (LANGS.includes(x) && x!==lang){ lang = x; render(); } });

$('bookForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  const err = !v('f-name') ? T('fNeedName') : !v('f-phone') ? T('fNeedPhone') : '';
  $('ferr').textContent = err;
  if (err) return;
  const s = $('f-service').value;
  const lines = [T('waHello'), '', `${T('fName')}: ${v('f-name')}`, `${T('fPhone')}: ${v('f-phone')}`,
    `${T('fService')}: ${s===''?T('fServiceAny'):L(C.services[+s].title)}`];
  if (v('f-date')) lines.push(`${T('fDate')}: ${v('f-date')}`);
  if (v('f-note')) lines.push(`${T('fNote')}: ${v('f-note')}`);
  const a = $('waOut'); a.href = waBase + '?text=' + encodeURIComponent(lines.join('\n')); a.click();
});

render();
setInterval(() => { const st = openState(); const el = document.querySelector('#nowCard .status'); if (el) el.querySelector('small').textContent = st.text; }, 60000);
})();
</script>

</body>
</html>
